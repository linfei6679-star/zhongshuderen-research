# Legacy Netlify entry only. Cloudflare is the sole production site.
[build]
command = "python3 -m zipfile -e legacy-entry-redirect.zip legacy-netlify"
publish = "legacy-netlify"
ignore = "node ignore-data-only.cjs"

[[redirects]]
from = "/*"
to = "https://zhongshuderen.pages.dev/:splat"
status = 301
force = true
